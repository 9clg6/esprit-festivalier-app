name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint
      - run: swiftlint --strict
      - name: Build EFKit
        working-directory: ios/EFKit
        run: swift build
      - name: Test EFKit
        run: if [ -d ios/EFKit/Tests ]; then (cd ios/EFKit && swift test); fi
      - name: Build app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build -scheme EspritFestivalier -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

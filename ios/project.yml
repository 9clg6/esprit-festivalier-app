name: EspritFestivalier
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  EFKit:
    path: EFKit
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  EspritFestivalier:
    type: application
    platform: iOS
    sources: [EspritFestivalier]
    dependencies:
      - package: EFKit
        product: EFDomain
      - package: EFKit
        product: EFData
      - package: EFKit
        product: EFDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.espritfestivalier.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Esprit Festivalier
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: EspritFestivalier/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
